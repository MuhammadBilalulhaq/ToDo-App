<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <body>
<div class="form-container">
<form id="register-form" class="row g-3">
        <h1>Signup Form</h1>

        <div class="col-md-12">
    <label for="register-UserName" class="form-label">UserName</label>
    <input type="text" class="form-control" id="register-UserName">
  </div>
  <div class="col-md-12">
    <label for="register-PhoneNumber" class="form-label">PhoneNumber</label>
    <input type="number" class="form-control" id="register-PhoneNumber">
  </div>
  <div class="col-md-12">
    <label for="register-email" class="form-label">Email</label>
    <input type="email" class="form-control" id="register-email">
  </div>
  <div class="col-md-12">
    <label for="register-password" class="form-label">Password</label>
    <input type="password" class="form-control" id="register-password">
  </div>
 
  
  <div class="col-12">
    <a href="../login/login.html">Already have an account ?</a>
    <button type="submit" class="btn btn-primary">register</button>
  </div>
</form>
</div>
